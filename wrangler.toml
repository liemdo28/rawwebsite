name = "rawwebsite"
pages_build_output_dir = "dist"
compatibility_date = "2024-01-15"
compatibility_flags = ["nodejs_compat"]

# ==============================================================================
# Cloudflare Bindings
# ==============================================================================

# KV namespace for persistent store (posts, media, menu, audit_log)
[[kv_namespaces]]
binding = "RAWWEBSITE_KV"
id = "57a4e58e773445d590a658c7edecc853"

# R2 bucket for media uploads (images)
# Create with: wrangler r2 bucket create rawwebsite-media
# [[r2_buckets]]
# binding = "MEDIA_BUCKET"
# bucket_name = "rawwebsite-media"

# ==============================================================================
# Environment Variables
# ==============================================================================
# All of these — including STORE_BACKEND — are set via the Cloudflare Pages
# dashboard (Settings -> Environment variables), not here. STORE_BACKEND is
# deliberately NOT declared in a [vars] section: wrangler.toml only started
# being read at all once the conflicting wrangler.jsonc (2026-07-28
# deployment-routing incident) was removed, and a [vars] STORE_BACKEND here
# collided with the dashboard's own STORE_BACKEND var ("Binding name
# 'STORE_BACKEND' already in use"), failing the Function-publish step.
#
# ADMIN_SECRET        — Bearer token for admin API auth
# GITHUB_TOKEN        — Personal access token for Git publish worker
# GITHUB_OWNER        — Repository owner (e.g., "liemdo28")
# GITHUB_REPO         — Repository name (e.g., "rawwebsite")
# GITHUB_BRANCH       — Target branch (default: "main")
# AGENT_CODING_SECRET — Webhook signature secret for Agent-coding
# STORE_BACKEND       — "kv" in Production (dashboard-managed)
